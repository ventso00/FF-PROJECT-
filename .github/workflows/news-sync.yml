name: MadaFF daily news sync

on:
  schedule:
    - cron: '15 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update public news feed
        run: node scripts/update-news.mjs
      - name: Commit changed news feed
        run: |
          if git diff --quiet -- frontend/public/news.json; then
            echo "No news changes"
            exit 0
          fi
          git config user.name "madaff-news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/news.json
          git commit -m "chore: refresh daily MadaFF news"
          git push
